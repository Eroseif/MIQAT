{
  "name": "Build MIQAT APK",
  "on": { "push": { "branches": ["main", "master"] }, "workflow_dispatch": {} },
  "jobs": {
    "build": {
      "runs-on": "ubuntu-latest",
      "steps": [
        { "uses": "actions/checkout@v4" },
        { "uses": "actions/setup-java@v4", "with": { "distribution": "temurin", "java-version": "17" } },
        { "name": "Accept Android licences", "run": "yes | \"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager\" --licenses || true" },
        { "uses": "gradle/actions/setup-gradle@v4", "with": { "gradle-version": "8.9" } },
        { "name": "Build debug and release APKs", "run": "gradle --no-daemon assembleDebug assembleRelease" },
        { "name": "Upload debug APK", "uses": "actions/upload-artifact@v4", "with": { "name": "MIQAT-debug-apk", "path": "app/build/outputs/apk/debug/*.apk" } },
        { "name": "Upload release APK", "uses": "actions/upload-artifact@v4", "with": { "name": "MIQAT-release-apk", "path": "app/build/outputs/apk/release/*.apk" } },
        { "name": "Unit tests", "continue-on-error": true, "run": "gradle --no-daemon testDebugUnitTest" }
      ]
    }
  }
}
