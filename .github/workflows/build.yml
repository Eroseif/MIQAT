name: Build MIQAT APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KS_B64: ${{ secrets.MIQAT_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Prepare release signing key (only if secrets are set)
        if: ${{ env.KS_B64 != '' }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/miqat.jks"
          echo "MIQAT_KEYSTORE_PATH=$RUNNER_TEMP/miqat.jks" >> "$GITHUB_ENV"
          echo "MIQAT_KEYSTORE_PASSWORD=${{ secrets.MIQAT_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "MIQAT_KEY_ALIAS=${{ secrets.MIQAT_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "MIQAT_KEY_PASSWORD=${{ secrets.MIQAT_KEY_PASSWORD }}" >> "$GITHUB_ENV"
      - name: Build debug and release APKs
        run: gradle --no-daemon assembleDebug assembleRelease
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MIQAT-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: MIQAT-release-apk
          path: app/build/outputs/apk/release/*.apk
      - name: Unit tests (Qibla and Hijri maths)
        continue-on-error: true
        run: gradle --no-daemon testDebugUnitTest
